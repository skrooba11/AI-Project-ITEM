<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOBIS 시운전완료보고자료 자동화</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/tool.css') }}">
<style>
  .mold-type-row { display:flex; gap:16px; margin-bottom:8px; }
  .mold-type-row label { display:flex; align-items:center; gap:6px; font-weight:bold; cursor:pointer; }
</style>
</head>
<body>
<header><h1>MOBIS 시운전완료보고자료 자동화</h1><a href="/">&larr; 허브로 돌아가기</a></header>
<main>
  <form id="gen-form" class="card">
    <h2>금형 종류</h2>
    <div class="mold-type-row">
      <label><input type="radio" name="mold_type" value="일반" checked> 일반 금형</label>
      <label><input type="radio" name="mold_type" value="다색"> 다색 금형 (1차/2차)</label>
    </div>

    <div class="field-row">
      <label>시운전보고자료 엑셀 파일 (.xlsx) *</label>
      <input type="file" name="excel_file" accept=".xlsx" required>
    </div>

    <div id="normal-section">
      <div class="section-title">사진 / 자재표</div>
      <div class="field-row"><label>금형 상측 사진</label><input type="file" name="mold_1" accept="image/*"></div>
      <div class="field-row"><label>금형 하측 사진</label><input type="file" name="mold_2" accept="image/*"></div>
      <div class="field-row"><label>금형 전체(ASSY) 사진</label><input type="file" name="mold_3" accept="image/*"></div>
      <div class="field-row"><label>제품 사진</label><input type="file" name="product" accept="image/*"></div>
      <div class="field-row"><label>금형자재표 파일 (.xlsx)</label><input type="file" name="material" accept=".xlsx"></div>
    </div>

    <div id="dual-section" class="hidden">
      <div class="section-title">1차 금형</div>
      <div class="field-row"><label>1차 금형 상측 사진</label><input type="file" name="mold_1_1" accept="image/*"></div>
      <div class="field-row"><label>1차 금형 하측 사진</label><input type="file" name="mold_1_2" accept="image/*"></div>
      <div class="field-row"><label>1차 금형 전체(ASSY) 사진</label><input type="file" name="mold_1_3" accept="image/*"></div>
      <div class="field-row"><label>1차 금형자재표 파일 (.xlsx)</label><input type="file" name="material_1" accept=".xlsx"></div>

      <div class="section-title">2차 금형</div>
      <div class="field-row"><label>2차 금형 상측 사진</label><input type="file" name="mold_2_1" accept="image/*"></div>
      <div class="field-row"><label>2차 금형 하측 사진</label><input type="file" name="mold_2_2" accept="image/*"></div>
      <div class="field-row"><label>2차 금형 전체(ASSY) 사진</label><input type="file" name="mold_2_3" accept="image/*"></div>
      <div class="field-row"><label>2차 금형자재표 파일 (.xlsx)</label><input type="file" name="material_2" accept=".xlsx"></div>

      <div class="section-title">공통</div>
      <div class="field-row"><label>1+2차 제품 사진</label><input type="file" name="product" accept="image/*"></div>
    </div>

    <button type="submit" id="submit-btn" class="btn">보고자료 생성 &amp; 다운로드</button>
    <div id="msg-area"></div>
  </form>
</main>

<script src="{{ url_for('static', filename='js/upload-form.js') }}"></script>
<script>
const form = document.getElementById("gen-form");
const normalSection = document.getElementById("normal-section");
const dualSection = document.getElementById("dual-section");

form.querySelectorAll('input[name="mold_type"]').forEach((radio) => {
  radio.addEventListener("change", () => {
    const isDual = form.querySelector('input[name="mold_type"]:checked').value === "다색";
    normalSection.classList.toggle("hidden", isDual);
    dualSection.classList.toggle("hidden", !isDual);
  });
});

wireGenerateForm("gen-form", "/mobis-siunjeon/generate", "보고자료 생성 & 다운로드");
</script>
</body>
</html>
